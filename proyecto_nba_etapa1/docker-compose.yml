services:
  postgres:
    image: postgres:16
    container_name: nba_project_db
    environment:
      POSTGRES_DB: nba_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nba_postgres_data:/var/lib/postgresql/data

volumes:
  nba_postgres_data:

